# Configuration for Multimodal App Orchestrator
# Updated for high resilience and premium video stability

routing:
  text_generation:
    - provider: "groq"
      model: "llama-3.3-70b-versatile"
    - provider: "gemini"
      model: "gemini-1.5-flash"
    - provider: "openrouter"
      model: "anthropic/claude-3-haiku"

  image_generation:
    - provider: "pollinations"
      model: "flux"
    - provider: "huggingface"
      model: "stabilityai/stable-diffusion-xl-base-1.0"
    - provider: "openrouter"
      model: "black-forest-labs/flux-1-schnell"

  audio_generation:
    - provider: "elevenlabs"
      model: "elevenlabs-v2-pro"
      timeout: 60
    - provider: "edge-tts"
      model: "en-IN-NeerjaNeural"
      timeout: 30

  image_to_text:
    - provider: "gemini"
      model: "gemini-2.0-flash"
    - provider: "openrouter"
      model: "qwen/qwen2.5-vl-72b-instruct"
    - provider: "huggingface"
      model: "Salesforce/blip-image-captioning-base"

  video_generation:
    - provider: "kling"
      model: "kling-v3-video"
      timeout: 120
    - provider: "replicate"
      model: "stability-ai/stable-video-diffusion:ac732d8354fd18dbbf3c9d61458a0ad37a22f77e682247b97f51f11e967a6e60"
      timeout: 120
    - provider: "pexels"
      model: "pexels-cinematic-v1"
      timeout: 30

app_settings:
  theme: "dark"
  cache_dir: "./cache"
  max_history_len: 20
  log_level: "INFO"
  image_to_video_provider: "kling"
  kling_image_to_video_model: "kling-v3-video"
  replicate_image_to_video_model: "stability-ai/stable-video-diffusion:ac732d8354fd18dbbf3c9d61458a0ad37a22f77e682247b97f51f11e967a6e60"
  gemini_vision_model: "gemini-2.0-flash"
  video_text_gemini_model: "gemini-2.0-flash"
  openrouter_vision_model: "qwen/qwen2.5-vl-72b-instruct"
  hf_vision_model: "Salesforce/blip-image-captioning-base"
  text_model_groq: "llama-3.3-70b-versatile"
